id: cui-protection-standards
category: compliance-security
priority: 10
updated: 2026-02-09
title: Controlled Unclassified Information (CUI) Protection Standards
description: |
  Standards for protecting Controlled Unclassified Information (CUI) in code and systems,
  aligned with NIST SP 800-171 Rev 3 and GSA CIO-IT-Security-21-112 Rev 1 requirements.

  These standards apply when developing systems that store, process, or transmit CUI
  for federal contractors and agencies. GSA "showstopper" requirements are marked as
  CRITICAL and must not be bypassed.

compliance_framework:
  - NIST SP 800-171 Rev 3
  - NIST SP 800-172 (enhanced, selected)
  - NIST SP 800-53 Rev 5 (privacy controls)
  - GSA CIO-IT-Security-21-112 Rev 1

rules:
  # ============================================================================
  # SHOWSTOPPER REQUIREMENTS (GSA Critical - Cannot be waived)
  # ============================================================================

  - id: CUI-SS-001
    action: ALWAYS
    severity: CRITICAL
    rule: "Implement multifactor authentication (MFA) for all CUI access - this is a GSA showstopper requirement"
    nist_control: "3.5.3"
    applies_to:
      - "src/auth/**/*.{js,ts,py}"
      - "src/api/**/*.{js,ts,py}"
      - "**/login*.{js,ts,py}"

  - id: CUI-SS-002
    action: ALWAYS
    severity: CRITICAL
    rule: "Use only FIPS 140-2/140-3 validated cryptographic modules for CUI encryption - this is a GSA showstopper requirement"
    nist_control: "3.13.11"
    applies_to:
      - "src/crypto/**/*.{js,ts,py}"
      - "src/security/**/*.{js,ts,py}"
      - "**/encrypt*.{js,ts,py}"

  - id: CUI-SS-003
    action: ALWAYS
    severity: CRITICAL
    rule: "Remediate high/critical vulnerabilities within 30 days, medium within 90 days - this is a GSA showstopper requirement"
    nist_control: "3.14.1"

  - id: CUI-SS-004
    action: NEVER
    severity: CRITICAL
    rule: "Use unsupported software, libraries, or dependencies in CUI systems - this is a GSA showstopper requirement"
    nist_control: "3.4.9"
    applies_to:
      - "package.json"
      - "requirements.txt"
      - "Cargo.toml"
      - "go.mod"

  # ============================================================================
  # ACCESS CONTROL (NIST 800-171 3.1)
  # ============================================================================

  - id: CUI-AC-001
    action: ALWAYS
    severity: HIGH
    rule: "Limit system access to authorized users, processes, and devices"
    nist_control: "3.1.1"

  - id: CUI-AC-002
    action: ALWAYS
    severity: HIGH
    rule: "Limit system access to the types of transactions and functions that authorized users are permitted to execute"
    nist_control: "3.1.2"

  - id: CUI-AC-003
    action: ALWAYS
    severity: HIGH
    rule: "Control the flow of CUI in accordance with approved authorizations - implement data flow enforcement"
    nist_control: "3.1.3"

  - id: CUI-AC-004
    action: ALWAYS
    severity: MEDIUM
    rule: "Separate duties of individuals to reduce risk of malicious activity - no single user should control entire CUI lifecycle"
    nist_control: "3.1.4"

  - id: CUI-AC-005
    action: ALWAYS
    severity: HIGH
    rule: "Employ the principle of least privilege - grant only minimum access required for job function"
    nist_control: "3.1.5"
    applies_to:
      - "src/auth/**/*.{js,ts,py}"
      - "**/permissions*.{js,ts,py}"
      - "**/rbac*.{js,ts,py}"

  - id: CUI-AC-006
    action: ALWAYS
    severity: MEDIUM
    rule: "Use non-privileged accounts when accessing non-security functions"
    nist_control: "3.1.6"

  - id: CUI-AC-007
    action: ALWAYS
    severity: HIGH
    rule: "Prevent non-privileged users from executing privileged functions and capture execution in audit logs"
    nist_control: "3.1.7"

  - id: CUI-AC-008
    action: ALWAYS
    severity: MEDIUM
    rule: "Limit unsuccessful logon attempts - implement account lockout after 5 failed attempts"
    nist_control: "3.1.8"

  - id: CUI-AC-009
    action: ALWAYS
    severity: MEDIUM
    rule: "Display privacy and security notices before granting access to CUI systems"
    nist_control: "3.1.9"

  - id: CUI-AC-010
    action: ALWAYS
    severity: MEDIUM
    rule: "Terminate sessions after 15 minutes of inactivity for CUI access"
    nist_control: "3.1.11"

  # ============================================================================
  # AUDIT AND ACCOUNTABILITY (NIST 800-171 3.3)
  # ============================================================================

  - id: CUI-AU-001
    action: ALWAYS
    severity: HIGH
    rule: "Create and retain audit logs sufficient to enable monitoring, analysis, investigation, and reporting of unlawful or unauthorized CUI activity"
    nist_control: "3.3.1"
    applies_to:
      - "src/audit/**/*.{js,ts,py}"
      - "src/logging/**/*.{js,ts,py}"

  - id: CUI-AU-002
    action: ALWAYS
    severity: HIGH
    rule: "Ensure actions of individual users can be uniquely traced - no shared accounts for CUI access"
    nist_control: "3.3.2"

  - id: CUI-AU-003
    action: ALWAYS
    severity: MEDIUM
    rule: "Review and update audited events annually or when system changes"
    nist_control: "3.3.3"

  - id: CUI-AU-004
    action: ALWAYS
    severity: HIGH
    rule: "Alert on audit logging process failures - audit system must be monitored"
    nist_control: "3.3.4"

  - id: CUI-AU-005
    action: ALWAYS
    severity: HIGH
    rule: "Protect audit information and audit logging tools from unauthorized access, modification, and deletion"
    nist_control: "3.3.8"

  - id: CUI-AU-006
    action: ALWAYS
    severity: MEDIUM
    rule: "Limit audit log management to privileged users only"
    nist_control: "3.3.9"

  # ============================================================================
  # IDENTIFICATION AND AUTHENTICATION (NIST 800-171 3.5)
  # ============================================================================

  - id: CUI-IA-001
    action: ALWAYS
    severity: HIGH
    rule: "Identify system users, processes, and devices before allowing access to CUI"
    nist_control: "3.5.1"

  - id: CUI-IA-002
    action: ALWAYS
    severity: HIGH
    rule: "Authenticate users, processes, and devices as prerequisite to system access"
    nist_control: "3.5.2"

  - id: CUI-IA-003
    action: ALWAYS
    severity: HIGH
    rule: "Employ replay-resistant authentication mechanisms for CUI network access"
    nist_control: "3.5.4"

  - id: CUI-IA-004
    action: ALWAYS
    severity: HIGH
    rule: "Use cryptographically-based bidirectional authentication for CUI systems"
    nist_control: "3.5.6"

  - id: CUI-IA-005
    action: NEVER
    severity: HIGH
    rule: "Store passwords in plaintext - use salted hashes with strong algorithms (bcrypt, Argon2, PBKDF2)"
    nist_control: "3.5.10"
    applies_to:
      - "src/auth/**/*.{js,ts,py}"
      - "**/password*.{js,ts,py}"
      - "**/credential*.{js,ts,py}"

  - id: CUI-IA-006
    action: ALWAYS
    severity: MEDIUM
    rule: "Obscure feedback of authentication information during authentication process"
    nist_control: "3.5.11"

  # ============================================================================
  # SYSTEM AND COMMUNICATIONS PROTECTION (NIST 800-171 3.13)
  # ============================================================================

  - id: CUI-SC-001
    action: ALWAYS
    severity: HIGH
    rule: "Monitor, control, and protect communications at external boundaries and key internal boundaries"
    nist_control: "3.13.1"

  - id: CUI-SC-002
    action: ALWAYS
    severity: HIGH
    rule: "Employ architectural designs and software development techniques that promote effective information security"
    nist_control: "3.13.2"

  - id: CUI-SC-003
    action: ALWAYS
    severity: HIGH
    rule: "Separate user functionality from system management functionality"
    nist_control: "3.13.3"

  - id: CUI-SC-004
    action: ALWAYS
    severity: HIGH
    rule: "Prevent unauthorized and unintended information transfer via shared system resources"
    nist_control: "3.13.4"

  - id: CUI-SC-005
    action: ALWAYS
    severity: HIGH
    rule: "Implement subnetworks for publicly accessible system components that are physically or logically separated from internal networks"
    nist_control: "3.13.5"

  - id: CUI-SC-006
    action: ALWAYS
    severity: HIGH
    rule: "Deny network communications traffic by default and allow by exception (deny-all, permit-by-exception)"
    nist_control: "3.13.6"

  - id: CUI-SC-007
    action: ALWAYS
    severity: HIGH
    rule: "Prevent remote devices from simultaneously establishing non-remote connections and communicating via other connections to external networks (split tunneling prohibition)"
    nist_control: "3.13.7"

  - id: CUI-SC-008
    action: ALWAYS
    severity: HIGH
    rule: "Implement cryptographic mechanisms to prevent unauthorized disclosure of CUI during transmission - use TLS 1.2+ minimum, TLS 1.3 preferred"
    nist_control: "3.13.8"
    applies_to:
      - "src/api/**/*.{js,ts,py}"
      - "src/network/**/*.{js,ts,py}"
      - "**/http*.{js,ts,py}"

  - id: CUI-SC-009
    action: ALWAYS
    severity: HIGH
    rule: "Terminate network connections at the end of sessions or after 30 minutes of inactivity"
    nist_control: "3.13.9"

  - id: CUI-SC-010
    action: ALWAYS
    severity: HIGH
    rule: "Establish and manage cryptographic keys using FIPS-validated key management technology"
    nist_control: "3.13.10"

  - id: CUI-SC-011
    action: ALWAYS
    severity: HIGH
    rule: "Protect the confidentiality of CUI at rest using AES-256 encryption with FIPS-validated implementation"
    nist_control: "3.13.16"
    applies_to:
      - "src/storage/**/*.{js,ts,py}"
      - "src/database/**/*.{js,ts,py}"

  # ============================================================================
  # SYSTEM AND INFORMATION INTEGRITY (NIST 800-171 3.14)
  # ============================================================================

  - id: CUI-SI-001
    action: ALWAYS
    severity: HIGH
    rule: "Identify, report, and correct system flaws in a timely manner"
    nist_control: "3.14.1"

  - id: CUI-SI-002
    action: ALWAYS
    severity: HIGH
    rule: "Provide protection from malicious code at designated locations (endpoints, network boundaries, servers)"
    nist_control: "3.14.2"

  - id: CUI-SI-003
    action: ALWAYS
    severity: MEDIUM
    rule: "Monitor system security alerts and advisories and take appropriate actions"
    nist_control: "3.14.3"

  - id: CUI-SI-004
    action: ALWAYS
    severity: HIGH
    rule: "Update malicious code protection mechanisms when new releases are available"
    nist_control: "3.14.4"

  - id: CUI-SI-005
    action: ALWAYS
    severity: HIGH
    rule: "Perform periodic and real-time scans for malicious code"
    nist_control: "3.14.5"

  - id: CUI-SI-006
    action: ALWAYS
    severity: HIGH
    rule: "Monitor organizational systems to detect attacks and indicators of potential attacks"
    nist_control: "3.14.6"

  - id: CUI-SI-007
    action: ALWAYS
    severity: HIGH
    rule: "Identify unauthorized use of organizational systems"
    nist_control: "3.14.7"

anti_patterns:
  - "Storing CUI in unencrypted databases or file systems"
  - "Using self-signed certificates for CUI transmission without proper validation"
  - "Implementing custom cryptography instead of FIPS-validated modules"
  - "Sharing user accounts or credentials for CUI system access"
  - "Logging CUI data in plaintext in application logs"
  - "Using deprecated TLS versions (1.0, 1.1) for CUI transmission"
  - "Disabling MFA for convenience or 'trusted' networks"
  - "Using dependencies with known CVEs in CUI systems"
  - "Storing API keys or credentials in source code that accesses CUI"
  - "Allowing indefinite sessions without re-authentication"

examples:
  fips_encryption: |
    // WRONG: Non-FIPS encryption
    const crypto = require('crypto');
    const cipher = crypto.createCipheriv('aes-256-cbc', key, iv);

    // RIGHT: Use FIPS-validated module with explicit mode
    const { createCipheriv } = require('crypto');
    process.env.OPENSSL_CONF = '/path/to/openssl-fips.cnf';
    // Verify FIPS mode: crypto.getFips() should return 1
    if (!crypto.getFips()) {
      throw new Error('FIPS mode not enabled - CUI encryption requires FIPS');
    }
    const cipher = createCipheriv('aes-256-gcm', key, iv);

  mfa_implementation: |
    // WRONG: Single-factor authentication for CUI access
    async function authenticate(username, password) {
      const user = await verifyPassword(username, password);
      return generateToken(user);  // CUI accessible with just password
    }

    // RIGHT: MFA required for CUI access
    async function authenticate(username, password, mfaCode) {
      const user = await verifyPassword(username, password);

      // MFA is mandatory for CUI - not optional
      if (!mfaCode) {
        throw new AuthError('MFA_REQUIRED', 'MFA code required for CUI access');
      }

      const mfaValid = await verifyMFA(user.id, mfaCode);
      if (!mfaValid) {
        await auditLog('MFA_FAILED', { userId: user.id, timestamp: Date.now() });
        throw new AuthError('MFA_INVALID', 'Invalid MFA code');
      }

      await auditLog('AUTH_SUCCESS', { userId: user.id, mfaUsed: true });
      return generateToken(user, { cuiAccess: true });
    }

  audit_logging: |
    // WRONG: Insufficient audit logging
    function accessCUI(userId, documentId) {
      return database.getCUIDocument(documentId);
    }

    // RIGHT: Comprehensive audit trail
    async function accessCUI(userId, documentId, context) {
      const auditEntry = {
        timestamp: new Date().toISOString(),
        userId: userId,
        action: 'CUI_ACCESS',
        resourceId: documentId,
        resourceType: 'CUI_DOCUMENT',
        ipAddress: context.ipAddress,
        userAgent: context.userAgent,
        sessionId: context.sessionId,
        result: 'PENDING'
      };

      try {
        // Verify authorization before access
        const authorized = await checkCUIAuthorization(userId, documentId);
        if (!authorized) {
          auditEntry.result = 'DENIED';
          auditEntry.reason = 'INSUFFICIENT_PRIVILEGES';
          await writeAuditLog(auditEntry);
          throw new AuthorizationError('Access denied to CUI document');
        }

        const document = await database.getCUIDocument(documentId);
        auditEntry.result = 'SUCCESS';
        await writeAuditLog(auditEntry);
        return document;

      } catch (error) {
        auditEntry.result = 'ERROR';
        auditEntry.error = error.message;
        await writeAuditLog(auditEntry);
        throw error;
      }
    }

  dependency_validation: |
    // package.json validation for CUI systems
    // Run before deployment: npm audit --audit-level=high

    // CI/CD pipeline check
    const { execSync } = require('child_process');

    function validateDependencies() {
      // Check for known vulnerabilities
      const auditResult = execSync('npm audit --json', { encoding: 'utf8' });
      const audit = JSON.parse(auditResult);

      if (audit.metadata.vulnerabilities.high > 0 ||
          audit.metadata.vulnerabilities.critical > 0) {
        throw new Error(
          `CUI-SS-003 VIOLATION: ${audit.metadata.vulnerabilities.critical} critical, ` +
          `${audit.metadata.vulnerabilities.high} high vulnerabilities found. ` +
          `Must remediate before deployment to CUI system.`
        );
      }

      // Check for unsupported packages (CUI-SS-004)
      const outdated = execSync('npm outdated --json', { encoding: 'utf8' });
      // Flag packages that are end-of-life or unmaintained
    }

enforcement:
  pre_commit_hook: true
  ci_cd_check: true
  failure_severity: critical
  blocking: true
  audit_required: true

context: |
  The General Services Administration (GSA) issued CIO-IT-Security-21-112 Rev 1 on
  January 5, 2026, establishing new requirements for protecting Controlled Unclassified
  Information (CUI) in nonfederal contractor systems.

  Unlike DoD CMMC which requires 100% compliance, GSA allows approval with documented
  gaps that are assessed and tracked. However, four "showstopper" requirements cannot
  be waived:

  1. Multifactor Authentication (MFA)
  2. FIPS-validated encryption
  3. Timely vulnerability remediation (30 days critical/high, 90 days medium)
  4. No unsupported software

  These standards encode NIST SP 800-171 Rev 3 requirements as actionable rules for
  AI-assisted development. When MindMeld injects these standards, the AI generates
  compliant code and the injection log serves as audit evidence.

  Federal contractors using GlideCoding can demonstrate to auditors:
  - What standards were enforced
  - When they were applied
  - What code was generated under governance

  This transforms the compliance question from "did you review the code?" to
  "what governance was applied during generation?"

